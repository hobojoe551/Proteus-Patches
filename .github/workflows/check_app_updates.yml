name: Auto-check Amazon Business Updates

on:
  schedule:
    # Runs every day at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  check-updates:
    name: Check for new Amazon Business version
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run version check
        id: version_check
        run: python3 .github/scripts/check_amazon_updates.py

      - name: Setup Java (for metadata generation)
        if: steps.version_check.outputs.has_update == 'true'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Regenerate patches list
        if: steps.version_check.outputs.has_update == 'true'
        run: |
          chmod +x gradlew
          ./gradlew generatePatchesList --stacktrace
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit & push update
        if: steps.version_check.outputs.has_update == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add patches/src/main/kotlin/app/template/patches/shared/Constants.kt patches-list.json
          git commit -m "feat(amazon): add Amazon Business ${{ steps.version_check.outputs.new_version }}"
          git push origin main
